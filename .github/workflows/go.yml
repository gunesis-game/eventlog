name: Go verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Go checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true

      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        shell: bash
        run: scripts/go-test-verbose.sh "Tests (${{ runner.os }})"

      - name: Race test
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/go-test-verbose.sh "Race tests (${{ runner.os }})" -race

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  cleanup:
    if: github.ref == 'refs/heads/main'
    name: Retain workflow history
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted repository policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Retain workflow run history at startup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cleanup-workflow-runs.py
