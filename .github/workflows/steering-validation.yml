name: Steering state validation

on:
  push:
    paths:
      - 'steering.md'
      - 'docs/dev-life-cycle/**'
      - 'scripts/validate-steering.py'
      - 'docs/project/decisions.md'
      - '.github/workflows/steering-validation.yml'
  pull_request:
    paths:
      - 'steering.md'
      - 'docs/dev-life-cycle/**'
      - 'scripts/validate-steering.py'
      - '.github/workflows/steering-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate cycle registry and project decision ledger
        run: python3 scripts/validate-steering.py
