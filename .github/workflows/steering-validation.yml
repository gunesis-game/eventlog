name: Steering state validation

on:
  push:
    branches:
      - main
    paths:
      - 'steering.md'
      - 'docs/dev-life-cycle/README.md'
      - 'docs/standards/**'
      - 'docs/project/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'TEMPLATE_VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test workflow-run retention policy
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate steering and engineering standards
        run: python3 scripts/validate-steering.py

  cleanup:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted repository policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Retain workflow run history at startup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cleanup-workflow-runs.py
