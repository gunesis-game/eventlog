<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc">
<title id="title">Flow between two eventlog devices on web storage</title>
<desc id="desc">Device A and device B each append only to their own folder in the owner's eventlog folder in Google Drive and read the other device's folder. Each posts the end of its log to a Firebase board, which streams changes to the other device. Local disks hold only each device's own device state.</desc>
<style>
.bg{fill:#ffffff}
.t{font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f1e1d}
.s{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5f5e5a}
.dev rect{fill:#E1F5EE;stroke:#0F6E56}
.dev .t{fill:#085041}
.dev .s{fill:#0F6E56}
.log rect{fill:#EEEDFE;stroke:#534AB7}
.log .t{fill:#3C3489}
.log .s{fill:#534AB7}
.board rect{fill:#F1EFE8;stroke:#5F5E5A}
.board .t{fill:#444441}
.board .s{fill:#5F5E5A}
.frame{fill:none;stroke:#888780;stroke-dasharray:4 4}
.arr{fill:none;stroke:#5f5e5a;stroke-width:1.5}
.head{fill:none;stroke:#5f5e5a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#1f1e1d}
.t{fill:#f1efe8}
.s{fill:#b4b2a9}
.dev rect{fill:#085041;stroke:#5DCAA5}
.dev .t{fill:#E1F5EE}
.dev .s{fill:#9FE1CB}
.log rect{fill:#3C3489;stroke:#AFA9EC}
.log .t{fill:#EEEDFE}
.log .s{fill:#CECBF6}
.board rect{fill:#444441;stroke:#B4B2A9}
.board .t{fill:#F1EFE8}
.board .s{fill:#D3D1C7}
.frame{stroke:#B4B2A9}
.arr,.head{stroke:#b4b2a9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="460"/>

<g class="dev">
<rect x="30" y="90" width="160" height="200" rx="8" stroke-width="0.5"/>
<text class="t" x="110" y="114" text-anchor="middle">Device A</text>
<text class="s" x="110" y="142" text-anchor="middle">App and eventlog</text>
<text class="s" x="110" y="164" text-anchor="middle">Local disk holds only</text>
<text class="s" x="110" y="182" text-anchor="middle">device/ (identity, lock)</text>
<text class="s" x="110" y="210" text-anchor="middle">Readers merge both</text>
<text class="s" x="110" y="228" text-anchor="middle">logs in causal order</text>
</g>
<g class="dev">
<rect x="490" y="90" width="160" height="200" rx="8" stroke-width="0.5"/>
<text class="t" x="570" y="114" text-anchor="middle">Device B</text>
<text class="s" x="570" y="142" text-anchor="middle">App and eventlog</text>
<text class="s" x="570" y="164" text-anchor="middle">Local disk holds only</text>
<text class="s" x="570" y="182" text-anchor="middle">device/ (identity, lock)</text>
<text class="s" x="570" y="210" text-anchor="middle">Readers merge both</text>
<text class="s" x="570" y="228" text-anchor="middle">logs in causal order</text>
</g>

<rect class="frame" x="230" y="40" width="220" height="280" rx="12" stroke-width="0.5"/>
<text class="t" x="340" y="64" text-anchor="middle">eventlog/ in Google Drive</text>
<text class="s" x="340" y="84" text-anchor="middle">Owner's folder, with log.json</text>

<g class="log">
<rect x="250" y="110" width="180" height="62" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="134" text-anchor="middle">devices/A/</text>
<text class="s" x="340" y="156" text-anchor="middle">Only A writes here</text>
</g>
<g class="log">
<rect x="250" y="210" width="180" height="62" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="234" text-anchor="middle">devices/B/</text>
<text class="s" x="340" y="256" text-anchor="middle">Only B writes here</text>
</g>

<g class="board">
<rect x="250" y="360" width="180" height="62" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="384" text-anchor="middle">Firebase board</text>
<text class="s" x="340" y="406" text-anchor="middle">End of each device's log</text>
</g>

<text class="s" x="220" y="130" text-anchor="middle">append</text>
<line class="arr" x1="190" y1="142" x2="246" y2="142" marker-end="url(#arrow)"/>
<text class="s" x="460" y="130" text-anchor="middle">read</text>
<line class="arr" x1="430" y1="142" x2="486" y2="142" marker-end="url(#arrow)"/>
<text class="s" x="460" y="230" text-anchor="middle">append</text>
<line class="arr" x1="490" y1="242" x2="434" y2="242" marker-end="url(#arrow)"/>
<text class="s" x="220" y="230" text-anchor="middle">read</text>
<line class="arr" x1="250" y1="242" x2="194" y2="242" marker-end="url(#arrow)"/>

<text class="s" x="170" y="378" text-anchor="middle">position</text>
<path class="arr" d="M110 290 L110 391 L246 391" marker-end="url(#arrow)"/>
<text class="s" x="510" y="378" text-anchor="middle">stream</text>
<path class="arr" d="M430 391 L570 391 L570 294" marker-end="url(#arrow)"/>
</svg>
